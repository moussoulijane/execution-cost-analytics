[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "execution-cost-analytics"
version = "0.2.0"
description = "Reproducible educational laboratory for TWAP, VWAP, POV and implementation shortfall"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "numpy==1.26.4",
    "pandas==3.0.5",
    "matplotlib==3.10.8",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.15.11",
    "nbformat==5.10.4",
    "nbclient==0.11.0",
    "ipykernel==7.1.0",
    "ipython==9.17.1",
    "jupyter-client==8.10.0",
]

[project.scripts]
execution-cost-analytics = "execution_cost_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
